<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 工房のロボットアーム（このサイトのオリジナルのイラスト） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c939e"/>
      <stop offset=".5" stop-color="#d5dae0"/>
      <stop offset="1" stop-color="#7a818c"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#d49a12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- 工房の壁の線 -->
  <g stroke="#3a4558" stroke-width="2">
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="290" y1="0" x2="290" y2="300"/>
  </g>
  <!-- 床 -->
  <rect x="0" y="300" width="400" height="100" fill="#10141c"/>
  <ellipse cx="150" cy="335" rx="110" ry="18" fill="#000" opacity=".35"/>

  <!-- 土台 -->
  <rect x="80" y="300" width="140" height="30" rx="8" fill="#3b4250"/>
  <rect x="95" y="262" width="110" height="44" rx="10" fill="url(#metal)"/>
  <rect x="95" y="290" width="110" height="6" fill="#6b727d"/>

  <!-- 下の腕（土台から右上へ） -->
  <g transform="rotate(-62 150 262)">
    <rect x="135" y="262" width="150" height="34" rx="17" fill="url(#arm)" stroke="#8a6408" stroke-width="3"/>
    <rect x="160" y="272" width="90" height="6" rx="3" fill="#000" opacity=".18"/>
  </g>
  <!-- ひじの関節 -->
  <circle cx="150" cy="262" r="28" fill="#4a5262"/>
  <circle cx="150" cy="262" r="15" fill="url(#metal)"/>
  <!-- ケーブル -->
  <path d="M120 300 C 90 230, 150 150, 215 128" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round"/>

  <!-- 上の腕（右へ少し下向き） -->
  <g transform="rotate(16 218 136)">
    <rect x="218" y="122" width="110" height="28" rx="14" fill="url(#arm)" stroke="#8a6408" stroke-width="3"/>
    <rect x="236" y="130" width="70" height="5" rx="2.5" fill="#000" opacity=".18"/>
  </g>
  <circle cx="218" cy="136" r="24" fill="#4a5262"/>
  <circle cx="218" cy="136" r="12" fill="url(#metal)"/>

  <!-- 手首 -->
  <circle cx="324" cy="166" r="16" fill="#4a5262"/>
  <rect x="314" y="172" width="22" height="26" rx="5" fill="url(#metal)"/>
  <!-- 小さなライト（目のように見える） -->
  <circle cx="325" cy="164" r="22" fill="url(#glow)"/>
  <circle cx="325" cy="164" r="6" fill="#bff1ff"/>

  <!-- つかむ部分（2本の爪） -->
  <path d="M312 196 L300 230 L310 246 L318 240 L312 228 L322 200 Z" fill="#c9ced6" stroke="#5c636e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M338 196 L350 230 L340 246 L332 240 L338 228 L328 200 Z" fill="#c9ced6" stroke="#5c636e" stroke-width="3" stroke-linejoin="round"/>
</svg>
